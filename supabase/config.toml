# Supabase settings managed from this repository. `supabase config push` (CLI v3) changes only the
# properties declared here; everything else stays as configured in the dashboard.
project_id = "iijjfakamstitnputdqg"

[auth]
# Preview of the accounts branch until production is authorized.
site_url = "https://stake-originals-clone-git-fea-e54b22-patricks-projects-a81f4b64.vercel.app"
additional_redirect_urls = [
    "https://stake-originals-clone-*-patricks-projects-a81f4b64.vercel.app/**",
    "http://localhost:4174/**",
    "http://localhost:5173/**",
]
enable_signup = true
# Same policy the API enforces (server/account/validate.js).
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.rate_limit]
# The API calls Auth from Vercel's servers, so these per-IP limits are shared by all players.
# The API applies its own per-IP and per-e-mail limits first (rate_limit_hit).
sign_in_sign_ups = 300
token_refresh = 1800
token_verifications = 300

[auth.email]
enable_confirmations = true
secure_password_change = true

# pt-BR templates (generated by scripts/accounts/emailTemplates.mjs). Supabase accepts them only
# with custom SMTP on (Resend, connected through Resend > Integrations > Supabase), so push them after
# that: `supabase config push` or `node scripts/accounts/pushEmailTemplates.mjs`. SMTP itself is not
# declared here, so neither command touches its credentials. Subjects match emailTemplates.mjs.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail na 123bet"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefinição de senha da 123bet"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme a troca de e-mail na 123bet"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Convite para a 123bet"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso à 123bet"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.reauthentication]
subject = "Código de confirmação da 123bet"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Sua senha da 123bet foi alterada"
content_path = "./supabase/templates/password_changed_notification.html"

[auth.email.notification.email_changed]
enabled = true
subject = "O e-mail da sua conta na 123bet foi alterado"
content_path = "./supabase/templates/email_changed_notification.html"
